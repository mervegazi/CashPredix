  />

  <!-- Upward AI Predictive Spine & 'P' Loop -->
  <path
    d="M19.5 37.5 V14 C19.5 14 25 9 31.5 13 C36.5 16.5 35 24 28 25.5 H19.5"
    stroke="url(#cp-tab-violet)"
